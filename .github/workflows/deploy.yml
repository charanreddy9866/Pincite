# Manual deploy to Cloud Run using Workload Identity Federation (no long-lived keys in GitHub).
# Required repository variables: GCP_PROJECT, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA.
# Secrets pincite-gemini-key and pincite-access-code must already exist (run deploy/cloudrun.sh once).
name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy pincite \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source . \
            --allow-unauthenticated \
            --memory 1Gi --max-instances 1 --timeout 300 \
            --set-secrets "GEMINI_API_KEY=pincite-gemini-key:latest,ACCESS_CODE=pincite-access-code:latest"
